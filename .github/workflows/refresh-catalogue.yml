name: Discover and publish one tool

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-catalogue.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalogue-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/cache@v6
        with:
          path: .cache
          key: github-evidence-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            github-evidence-${{ runner.os }}-

      - name: Search, rotate, and rebuild
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m pipeline.discover --limit 12
          python3 -m pipeline.autopublish --limit 1
          python3 -m pipeline.lifecycle
          python3 -m pipeline.catalog
          python3 -m pipeline.render

      - name: Commit publication directly
        run: |
          git config user.name "kgnx catalogue bot"
          git config user.email "catalogue-bot@users.noreply.github.com"
          git add data/candidates data/catalog/automatic.json \
            data/editorial data/tools site
          if git diff --cached --quiet; then
            echo "No catalogue changes"
            exit 0
          fi
          git commit -m "catalogue: publish daily automated selection"
          git push

      - name: Notify Telegram when configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_SITE_URL: https://kgnx.nx.kg
        run: python3 -m pipeline.telegram

      # Pushes made with GITHUB_TOKEN do not trigger another workflow, so the
      # scheduled job deploys its freshly built site itself.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy refreshed catalogue
        uses: actions/deploy-pages@v5
